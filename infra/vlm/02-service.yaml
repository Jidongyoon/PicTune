# PicTune VLM Service
#
# 담당: B  /  가이드: docs/manifest_guide.md 2절 고정값 표
#
# vlm-api 의 8001 만 노출한다.
#
# llama-server(8003)용 Service 는 만들지 않는다. 이유:
#   - 인증 없는 추론 서버가 클러스터에 공개된다
#   - 취소 로직이 Service(kube-proxy)를 경유하면서 스트림 종료 전파 타이밍이
#     달라진다. localhost 통신을 전제로 설계된 구현이다
#   - vlm-api 는 같은 Pod 안에서 127.0.0.1:8003 으로만 호출하므로 Service 가 필요없다
#
# 이 Service 이름은 web Deployment 의 VLM_WORKER_URL(http://pictune-vlm:8001)과
# 반드시 일치해야 한다.
apiVersion: v1
kind: Service
metadata:
  name: pictune-vlm
  namespace: pictune
  labels:
    app: pictune-vlm
spec:
  type: ClusterIP
  selector:
    app: pictune-vlm            # Deployment 의 template.metadata.labels 와 동일
  ports:
    - name: http
      port: 8001                # web 이 호출할 포트
      targetPort: vlm-http      # Deployment 의 vlm-api 컨테이너 포트 이름
      protocol: TCP
