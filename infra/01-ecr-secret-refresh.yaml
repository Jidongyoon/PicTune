# ECR 인증 토큰은 12시간 동안 유효하므로 6시간마다 갱신한다.
#
# 사전 준비:
#   1. aws-ecr-credentials.example.yaml을 참고하여
#      pictune/aws-ecr-credentials Secret을 서버에서 생성한다.
#
# ecr-secret이 없으면 생성하고, 이미 있으면 새 ECR 토큰으로 갱신한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: pictune
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  namespace: pictune
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - ecr-secret
    verbs:
      - get
      - patch
  # Kubernetes RBAC은 create 요청을 resourceNames로 제한할 수 없다.
  # Role의 namespace를 pictune으로 한정해 생성 권한의 범위를 줄인다.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  namespace: pictune
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: pictune
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-refresher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresh
  namespace: pictune
spec:
  # ECR 토큰의 12시간 유효기간보다 충분히 짧게 6시간마다 갱신한다.
  schedule: "0 */6 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: ecr-secret-refresh
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # 공개 ECR의 공식 AWS CLI 이미지이므로 ecr-secret 없이도 시작할 수 있다.
            - name: generate-secret-manifest
              image: public.ecr.aws/aws-cli/aws-cli:2.31.26
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  umask 077

                  AUTH_TOKEN="$(
                    aws ecr get-authorization-token \
                      --region "${AWS_REGION}" \
                      --query 'authorizationData[0].authorizationToken' \
                      --output text
                  )"

                  if [ -z "${AUTH_TOKEN}" ] || [ "${AUTH_TOKEN}" = "None" ]; then
                    echo "ECR authorization token is empty." >&2
                    exit 1
                  fi

                  DOCKER_CONFIG="$(
                    printf '{"auths":{"%s":{"auth":"%s"}}}' \
                      "${ECR_REGISTRY}" \
                      "${AUTH_TOKEN}" |
                      base64 |
                      tr -d '\n'
                  )"

                  printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"ecr-secret","namespace":"pictune"},"data":{".dockerconfigjson":"%s"},"type":"kubernetes.io/dockerconfigjson"}' \
                    "${DOCKER_CONFIG}" > /work/secret.json
                  chmod 0444 /work/secret.json
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-ecr-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-ecr-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  value: ap-northeast-2
                - name: AWS_DEFAULT_REGION
                  value: ap-northeast-2
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_PAGER
                  value: ""
                - name: ECR_REGISTRY
                  value: 508266022472.dkr.ecr.ap-northeast-2.amazonaws.com
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            # 공개 Kubernetes 레지스트리 이미지로, 생성된 Secret을 API에 apply한다.
            - name: apply-secret
              image: registry.k8s.io/kubectl:v1.34.1
              imagePullPolicy: IfNotPresent
              args:
                - apply
                - --filename=/work/secret.json
                - --server-side=true
                - --field-manager=ecr-secret-refresher
                - --force-conflicts
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
          volumes:
            - name: work
              emptyDir:
                medium: Memory
