# PicTune VLM 설정
#
# 담당: B  /  가이드: docs/manifest_guide.md 4절 "B. vlm"
#
# 이 ConfigMap은 model-init(initContainer)과 vlm-api 두 컨테이너가 함께 쓴다.
#
# 앞의 세 값(VLM_REPO_ID / VLM_REVISION / VLM_MODEL_DIR)은 model-init 이미지의
# Dockerfile ENV에도 같은 값이 들어 있어서, 이 ConfigMap이 없어도 initContainer는
# 일단 동작한다. 그래도 여기에 두는 이유는 docker/README.md 의 방침 때문이다.
#   "Dockerfile의 ENV는 로컬 실행용 기본값으로만 두고, 모델 저장소·revision·경로·
#    서비스 주소처럼 배포 환경에 따라 달라지는 값은 별도 ConfigMap으로 관리한다"
#
# 반면 LLAMA_SERVER_URL 은 성격이 다르다. 반드시 여기서 덮어써야 한다.
# vlm-api 이미지에는 http://llama-server:8003 이 기본값으로 박혀 있는데
# (docker/smolvlm/Dockerfile:6), 우리 구조에는 llama-server 라는 이름의 Service가
# 없다. 이 값을 덮어쓰지 않으면 DNS 조회 실패로 모든 분석 요청이 실패한다.
# 같은 Pod 안의 컨테이너라 127.0.0.1 로 호출한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pictune-vlm-config
  namespace: pictune
  labels:
    app: pictune-vlm
data:
  # --- model-init 용 ---
  VLM_REPO_ID: ggml-org/SmolVLM2-2.2B-Instruct-GGUF
  VLM_REVISION: 1bc3c9f74ceafd4c8d4411cc9cf188bba3798f91
  VLM_MODEL_DIR: /cache/vlm
  HF_HOME: /cache/vlm/.huggingface
  HF_HUB_DISABLE_TELEMETRY: "1"

  # --- vlm-api 용 (반드시 필요) ---
  LLAMA_SERVER_URL: http://127.0.0.1:8003
